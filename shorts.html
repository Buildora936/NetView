<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Regardez les Shorts sur NetView."
    >

    <meta
        name="theme-color"
        content="#2563EB"
    >

    <title>
        Shorts — NetView
    </title>

    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- =====================================================
         CORE CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/core/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/core/reset.css"
    >

    <link
        rel="stylesheet"
        href="css/core/typography.css"
    >

    <link
        rel="stylesheet"
        href="css/core/animations.css"
    >

    <link
        rel="stylesheet"
        href="css/core/utilities.css"
    >

    <!-- =====================================================
         COMPONENTS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/components/buttons.css"
    >

    <link
        rel="stylesheet"
        href="css/components/cards.css"
    >

    <link
        rel="stylesheet"
        href="css/components/forms.css"
    >

    <link
        rel="stylesheet"
        href="css/components/modal.css"
    >

    <link
        rel="stylesheet"
        href="css/components/toast.css"
    >

    <link
        rel="stylesheet"
        href="css/components/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="css/components/header.css"
    >

    <link
        rel="stylesheet"
        href="css/components/footer.css"
    >

    <link
        rel="stylesheet"
        href="css/components/loader.css"
    >

    <!-- =====================================================
         SHORTS CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/pages/shorts.css"
    >

</head>


<body class="nv-page shorts-page">


    <!-- =====================================================
         PAGE LOADER
         ===================================================== -->

    <div
        id="pageLoader"
        class="nv-page-loader"
        aria-hidden="true"
    >

        <div class="nv-loader"></div>

    </div>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header
        class="nv-header"
        id="nvHeader"
    >

        <div class="nv-header-left">

            <button
                id="menuButton"
                class="nv-icon-button"
                type="button"
                aria-label="Ouvrir le menu"
                aria-controls="nvSidebar"
                aria-expanded="false"
            >

                <i class="fa-solid fa-bars"></i>

            </button>


            <a
                href="index.html"
                class="nv-logo"
                aria-label="NetView"
            >

                <img
                    src="NetView.png"
                    alt="NetView"
                >

            </a>

        </div>


        <!-- =================================================
             SEARCH
             ================================================= -->

        <form
            id="headerSearchForm"
            class="nv-header-search"
            action="search.html"
            method="get"
        >

            <label
                for="headerSearchInput"
                class="sr-only"
            >
                Rechercher
            </label>

            <input
                id="headerSearchInput"
                name="q"
                type="search"
                placeholder="Rechercher"
                autocomplete="off"
            >

            <button
                type="submit"
                class="nv-icon-button"
                aria-label="Rechercher"
            >

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </form>


        <!-- =================================================
             HEADER RIGHT
             ================================================= -->

        <div class="nv-header-right">

            <button
                id="searchMobileButton"
                class="nv-icon-button nv-mobile-search"
                type="button"
                aria-label="Rechercher"
            >

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>


            <a
                href="upload.html"
                class="nv-icon-button"
                aria-label="Créer"
            >

                <i class="fa-solid fa-plus"></i>

            </a>


            <a
                href="notification.html"
                class="nv-icon-button nv-notification-button"
                aria-label="Notifications"
            >

                <i class="fa-regular fa-bell"></i>

                <span
                    id="notificationBadge"
                    class="nv-notification-badge"
                    hidden
                >
                    0
                </span>

            </a>


            <a
                href="profile.html"
                id="headerProfileLink"
                class="nv-header-avatar-link"
                aria-label="Profil"
            >

                <img
                    id="headerAvatar"
                    class="nv-header-avatar"
                    src="NetView_icone.png"
                    alt="Profil"
                >

            </a>

        </div>

    </header>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside
        id="nvSidebar"
        class="nv-sidebar"
        aria-label="Navigation principale"
    >

        <nav class="nv-sidebar-nav">

            <a
                href="index.html"
                data-nav="index"
                class="nv-sidebar-item"
            >

                <i class="fa-solid fa-house"></i>

                <span>
                    Accueil
                </span>

            </a>


            <a
                href="shorts.html"
                data-nav="shorts"
                class="nv-sidebar-item"
            >

                <i class="fa-solid fa-bolt"></i>

                <span>
                    Shorts
                </span>

            </a>


            <a
                href="subscriptions.html"
                data-nav="subscriptions"
                class="nv-sidebar-item"
            >

                <i class="fa-solid fa-tv"></i>

                <span>
                    Abonnements
                </span>

            </a>


            <a
                href="trending.html"
                data-nav="trending"
                class="nv-sidebar-item"
            >

                <i class="fa-solid fa-fire"></i>

                <span>
                    Tendances
                </span>

            </a>


            <div class="nv-sidebar-divider"></div>


            <a
                href="library.html"
                data-nav="library"
                class="nv-sidebar-item"
            >

                <i class="fa-solid fa-photo-film"></i>

                <span>
                    Bibliothèque
                </span>

            </a>


            <a
                href="playlist.html"
                data-nav="playlist"
                class="nv-sidebar-item"
            >

                <i class="fa-solid fa-list"></i>

                <span>
                    Playlists
                </span>

            </a>


            <a
                href="watch-later.html"
                class="nv-sidebar-item"
            >

                <i class="fa-regular fa-clock"></i>

                <span>
                    À regarder plus tard
                </span>

            </a>

        </nav>

    </aside>


    <!-- =====================================================
         SIDEBAR OVERLAY
         ===================================================== -->

    <div
        id="sidebarOverlay"
        class="nv-sidebar-overlay"
        hidden
    ></div>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main
        id="shortsMain"
        class="shorts-main"
    >

        <!-- =================================================
             SHORTS VIEWER
             ================================================= -->

        <section
            id="shortsViewer"
            class="shorts-viewer"
            aria-label="Lecteur Shorts"
        >


            <!-- =============================================
                 LOADING
                 ============================================= -->

            <div
                id="shortsLoading"
                class="shorts-loading"
            >

                <div class="nv-loader"></div>

                <p>
                    Chargement des Shorts...
                </p>

            </div>


            <!-- =============================================
                 EMPTY
                 ============================================= -->

            <div
                id="shortsEmpty"
                class="shorts-empty"
                hidden
            >

                <div class="shorts-empty-icon">

                    <i class="fa-solid fa-bolt"></i>

                </div>

                <h1>
                    Aucun Short disponible
                </h1>

                <p>
                    Aucun Short n'est disponible pour le moment.
                </p>

                <a
                    href="index.html"
                    class="nv-button nv-button-primary"
                >
                    Retour à l'accueil
                </a>

            </div>


            <!-- =============================================
                 CURRENT SHORT
                 ============================================= -->

            <article
                id="shortCard"
                class="short-card"
                hidden
            >

                <!-- =========================================
                     VIDEO
                     ========================================= -->

                <div class="short-video-container">

                    <video
                        id="shortVideo"
                        class="short-video"
                        playsinline
                        preload="metadata"
                        loop
                    ></video>


                    <!-- =====================================
                         VIDEO LOADER
                         ===================================== -->

                    <div
                        id="shortVideoLoader"
                        class="short-video-loader"
                        hidden
                    >

                        <div class="nv-loader"></div>

                    </div>


                    <!-- =====================================
                         PLAY OVERLAY
                         ===================================== -->

                    <button
                        id="shortPlayButton"
                        class="short-play-button"
                        type="button"
                        aria-label="Lire"
                    >

                        <i class="fa-solid fa-play"></i>

                    </button>


                    <!-- =====================================
                         VIDEO CONTROLS
                         ===================================== -->

                    <div
                        class="short-video-controls"
                    >

                        <button
                            id="shortMuteButton"
                            class="short-control-button"
                            type="button"
                            aria-label="Activer ou désactiver le son"
                        >

                            <i class="fa-solid fa-volume-high"></i>

                        </button>


                        <div
                            class="short-progress"
                        >

                            <div
                                id="shortProgressBar"
                                class="short-progress-bar"
                            ></div>

                        </div>


                        <button
                            id="shortFullscreenButton"
                            class="short-control-button"
                            type="button"
                            aria-label="Plein écran"
                        >

                            <i class="fa-solid fa-expand"></i>

                        </button>

                    </div>


                    <!-- =====================================
                         GRADIENT
                         ===================================== -->

                    <div
                        class="short-video-gradient"
                    ></div>


                    <!-- =====================================
                         SHORT INFORMATION
                         ===================================== -->

                    <div
                        class="short-info"
                    >

                        <a
                            id="shortChannelLink"
                            class="short-channel"
                            href="#"
                        >

                            <img
                                id="shortChannelAvatar"
                                class="short-channel-avatar"
                                src="NetView_icone.png"
                                alt=""
                            >

                            <span
                                id="shortChannelName"
                                class="short-channel-name"
                            >
                                Chaîne
                            </span>

                            <span
                                id="shortChannelVerified"
                                class="short-verified"
                                hidden
                                aria-label="Chaîne vérifiée"
                            >

                                <i class="fa-solid fa-circle-check"></i>

                            </span>

                        </a>


                        <button
                            id="shortSubscribeButton"
                            class="short-subscribe-button"
                            type="button"
                        >
                            S'abonner
                        </button>


                        <h1
                            id="shortTitle"
                            class="short-title"
                        ></h1>


                        <p
                            id="shortDescription"
                            class="short-description"
                        ></p>


                        <div
                            id="shortTags"
                            class="short-tags"
                        ></div>

                    </div>

                </div>


                <!-- =========================================
                     ACTIONS
                     ========================================= -->

                <aside
                    class="short-actions"
                    aria-label="Actions du Short"
                >

                    <button
                        id="shortLikeButton"
                        class="short-action-button"
                        type="button"
                        aria-label="J'aime"
                    >

                        <span class="short-action-icon">

                            <i class="fa-regular fa-thumbs-up"></i>

                        </span>

                        <span
                            id="shortLikeCount"
                            class="short-action-count"
                        >
                            0
                        </span>

                    </button>


                    <button
                        id="shortCommentButton"
                        class="short-action-button"
                        type="button"
                        aria-label="Commentaires"
                    >

                        <span class="short-action-icon">

                            <i class="fa-regular fa-comment"></i>

                        </span>

                        <span
                            id="shortCommentCount"
                            class="short-action-count"
                        >
                            0
                        </span>

                    </button>


                    <button
                        id="shortShareButton"
                        class="short-action-button"
                        type="button"
                        aria-label="Partager"
                    >

                        <span class="short-action-icon">

                            <i class="fa-solid fa-share"></i>

                        </span>

                        <span class="short-action-label">
                            Partager
                        </span>

                    </button>


                    <button
                        id="shortSaveButton"
                        class="short-action-button"
                        type="button"
                        aria-label="Enregistrer"
                    >

                        <span class="short-action-icon">

                            <i class="fa-regular fa-bookmark"></i>

                        </span>

                        <span class="short-action-label">
                            Enregistrer
                        </span>

                    </button>


                    <button
                        id="shortMoreButton"
                        class="short-action-button"
                        type="button"
                        aria-label="Plus d'options"
                    >

                        <span class="short-action-icon">

                            <i class="fa-solid fa-ellipsis"></i>

                        </span>

                    </button>


                    <!-- =====================================
                         CHANNEL AVATAR
                         ===================================== -->

                    <a
                        id="shortActionChannel"
                        class="short-action-channel"
                        href="#"
                        aria-label="Ouvrir la chaîne"
                    >

                        <img
                            id="shortActionChannelAvatar"
                            src="NetView_icone.png"
                            alt=""
                        >

                    </a>

                </aside>


                <!-- =========================================
                     NAVIGATION
                     ========================================= -->

                <div
                    class="short-navigation"
                >

                    <button
                        id="previousShortButton"
                        class="short-navigation-button"
                        type="button"
                        aria-label="Short précédent"
                    >

                        <i class="fa-solid fa-chevron-up"></i>

                    </button>


                    <button
                        id="nextShortButton"
                        class="short-navigation-button"
                        type="button"
                        aria-label="Short suivant"
                    >

                        <i class="fa-solid fa-chevron-down"></i>

                    </button>

                </div>

            </article>

        </section>

    </main>


    <!-- =====================================================
         COMMENTS DRAWER
         ===================================================== -->

    <section
        id="commentsPanel"
        class="short-comments-panel"
        aria-label="Commentaires"
        aria-hidden="true"
        hidden
    >

        <div class="short-comments-header">

            <div>

                <h2>
                    Commentaires
                </h2>

                <span
                    id="commentsTotal"
                    class="short-comments-total"
                >
                    0
                </span>

            </div>


            <button
                id="closeCommentsButton"
                class="nv-icon-button"
                type="button"
                aria-label="Fermer les commentaires"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>


        <!-- ===============================================
             COMMENT FORM
             =============================================== -->

        <form
            id="shortCommentForm"
            class="short-comment-form"
        >

            <img
                id="commentUserAvatar"
                class="short-comment-avatar"
                src="NetView_icone.png"
                alt=""
            >

            <div class="short-comment-input-wrapper">

                <label
                    for="shortCommentInput"
                    class="sr-only"
                >
                    Ajouter un commentaire
                </label>

                <textarea
                    id="shortCommentInput"
                    name="content"
                    rows="1"
                    maxlength="5000"
                    placeholder="Ajouter un commentaire..."
                    required
                ></textarea>

                <div
                    class="short-comment-form-actions"
                >

                    <button
                        id="cancelCommentButton"
                        type="button"
                        class="nv-button nv-button-secondary"
                        hidden
                    >
                        Annuler
                    </button>

                    <button
                        id="submitCommentButton"
                        type="submit"
                        class="nv-button nv-button-primary"
                    >
                        Commenter
                    </button>

                </div>

            </div>

        </form>


        <!-- ===============================================
             COMMENTS LIST
             =============================================== -->

        <div
            id="shortCommentsList"
            class="short-comments-list"
        >

            <div
                id="commentsLoading"
                class="short-comments-loading"
                hidden
            >

                <div class="nv-loader"></div>

            </div>


            <div
                id="commentsEmpty"
                class="short-comments-empty"
                hidden
            >

                <i class="fa-regular fa-comment"></i>

                <p>
                    Aucun commentaire pour le moment.
                </p>

            </div>

        </div>

    </section>


    <!-- =====================================================
         COMMENTS OVERLAY
         ===================================================== -->

    <div
        id="commentsOverlay"
        class="short-comments-overlay"
        hidden
    ></div>


    <!-- =====================================================
         SHARE MODAL
         ===================================================== -->

    <div
        id="shareModal"
        class="nv-modal"
        hidden
    >

        <div
            class="nv-modal-backdrop"
            data-close-modal="shareModal"
        ></div>


        <div
            class="nv-modal-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="shareModalTitle"
        >

            <div class="nv-modal-header">

                <h2 id="shareModalTitle">
                    Partager
                </h2>

                <button
                    class="nv-icon-button"
                    type="button"
                    data-close-modal="shareModal"
                    aria-label="Fermer"
                >

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>


            <div class="nv-modal-body">

                <button
                    id="nativeShareButton"
                    class="nv-share-option"
                    type="button"
                >

                    <i class="fa-solid fa-share-nodes"></i>

                    <span>
                        Partager
                    </span>

                </button>


                <button
                    id="copyShortLinkButton"
                    class="nv-share-option"
                    type="button"
                >

                    <i class="fa-solid fa-link"></i>

                    <span>
                        Copier le lien
                    </span>

                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         MORE OPTIONS MENU
         ===================================================== -->

    <div
        id="shortMoreMenu"
        class="short-more-menu"
        hidden
    >

        <button
            id="reportShortButton"
            type="button"
        >

            <i class="fa-regular fa-flag"></i>

            <span>
                Signaler
            </span>

        </button>


        <button
            id="notInterestedButton"
            type="button"
        >

            <i class="fa-regular fa-eye-slash"></i>

            <span>
                Pas intéressé
            </span>

        </button>

    </div>


    <!-- =====================================================
         TOAST
         ===================================================== -->

    <div
        id="toast"
        class="nv-toast"
        role="status"
        aria-live="polite"
        hidden
    >

        <span id="toastMessage"></span>

    </div>


    <!-- =====================================================
         APP SCRIPT
         ===================================================== -->

    <script
        type="module"
        src="js/pages/shorts.js"
    ></script>

</body>

</html>
