<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Shorts NetView"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>
        Shorts — NetView
    </title>


    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =====================================================
         CORE
         ===================================================== -->

    <link
        rel="stylesheet"
        href="CSS/core/variables.css"
    >

    <link
        rel="stylesheet"
        href="CSS/core/reset.css"
    >

    <link
        rel="stylesheet"
        href="CSS/core/typography.css"
    >

    <link
        rel="stylesheet"
        href="CSS/core/animations.css"
    >

    <link
        rel="stylesheet"
        href="CSS/core/utilities.css"
    >


    <!-- =====================================================
         COMPONENTS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="CSS/components/buttons.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/forms.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/modal.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/toast.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/header.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/loader.css"
    >


    <!-- =====================================================
         PAGE
         ===================================================== -->

    <link
        rel="stylesheet"
        href="CSS/pages/shorts.css"
    >

</head>


<body class="nv-page shorts-page">


    <!-- =====================================================
         APPLICATION
         ===================================================== -->

    <div
        id="shortsApp"
        class="shorts-app"
    >


        <!-- =================================================
             HEADER
             ================================================= -->

        <header
            id="nvHeader"
            class="nv-header shorts-header"
        >

            <div class="nv-header-left">

                <button
                    id="menuButton"
                    class="nv-icon-button"
                    type="button"
                    aria-label="Menu"
                    aria-controls="nvSidebar"
                    aria-expanded="false"
                >

                    <i class="fa-solid fa-bars"></i>

                </button>


                <a
                    href="index.html"
                    class="nv-logo"
                    aria-label="NetView"
                >

                    <img
                        src="NetView.png"
                        alt="NetView"
                    >

                </a>

            </div>


            <!-- =============================================
                 SEARCH
                 ============================================= -->

            <form
                id="headerSearchForm"
                class="nv-header-search"
                action="search.html"
                method="get"
            >

                <label
                    class="sr-only"
                    for="headerSearchInput"
                >
                    Rechercher
                </label>

                <input
                    id="headerSearchInput"
                    name="q"
                    type="search"
                    placeholder="Rechercher"
                    autocomplete="off"
                >


                <button
                    type="submit"
                    class="nv-icon-button"
                    aria-label="Rechercher"
                >

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

            </form>


            <!-- =============================================
                 RIGHT
                 ============================================= -->

            <div id="headerRight" class="nv-header-right"></div>

</header>

<aside id="sidebar" class="nv-sidebar">
    <nav class="nv-sidebar-nav"></nav>
</aside>


        <!-- =================================================
             SIDEBAR OVERLAY
             ================================================= -->

        <div
            id="sidebarOverlay"
            class="shorts-sidebar-overlay"
            hidden
        ></div>


        <!-- =================================================
             MAIN SHORTS
             ================================================= -->

        <main
            id="shortsMain"
            class="shorts-main"
        >


            <!-- =============================================
                 LOADING
                 ============================================= -->

            <div
                id="shortsLoading"
                class="shorts-loading"
            >

                <div class="nv-loader"></div>

            </div>


            <!-- =============================================
                 ERROR
                 ============================================= -->

            <section
                id="shortsError"
                class="shorts-state shorts-error"
                hidden
            >

                <div class="shorts-state-icon">

                    <i class="fa-solid fa-circle-exclamation"></i>

                </div>

                <h1>
                    Impossible de charger ce Short
                </h1>

                <p id="shortsErrorMessage">
                    Une erreur est survenue.
                </p>

                <button
                    id="retryShortButton"
                    type="button"
                    class="nv-button nv-button-primary"
                >
                    Réessayer
                </button>

            </section>


            <!-- =============================================
                 EMPTY
                 ============================================= -->

            <section
                id="shortsEmpty"
                class="shorts-state"
                hidden
            >

                <div class="shorts-state-icon">

                    <i class="fa-solid fa-bolt"></i>

                </div>

                <h1>
                    Aucun Short
                </h1>

                <p>
                    Aucun Short disponible actuellement.
                </p>

                <a
                    href="index.html"
                    class="nv-button nv-button-primary"
                >
                    Accueil
                </a>

            </section>


            <!-- =============================================
                 SHORT VIEWPORT
                 ============================================= -->

            <section
                id="shortViewport"
                class="short-viewport"
                aria-label="Short"
                hidden
            >


                <!-- =========================================
                     PREVIOUS
                     ========================================= -->

                <button
                    id="previousShortButton"
                    class="short-nav-button short-nav-up"
                    type="button"
                    aria-label="Short précédent"
                >

                    <i class="fa-solid fa-chevron-up"></i>

                </button>


                <!-- =========================================
                     VIDEO CARD
                     ========================================= -->

                <article
                    id="shortItem"
                    class="short-item"
                >


                    <!-- =====================================
                         VIDEO
                         ===================================== -->

                    <div
                        id="shortMedia"
                        class="short-media"
                    >

                        <video
                            id="shortVideo"
                            class="short-video"
                            playsinline
                            webkit-playsinline
                            preload="auto"
                        ></video>


                        <!-- =================================
                             VIDEO LOADING
                             ================================= -->

                        <div
                            id="shortMediaLoader"
                            class="short-media-loader"
                            hidden
                        >

                            <div class="nv-loader"></div>

                        </div>


                        <!-- =================================
                             PLAY
                             ================================= -->

                        <button
                            id="shortPlayButton"
                            class="short-play-button"
                            type="button"
                            aria-label="Lecture"
                        >

                            <i class="fa-solid fa-play"></i>

                        </button>


                        <!-- =================================
                             VIDEO BOTTOM GRADIENT
                             ================================= -->

                        <div
                            class="short-bottom-gradient"
                            aria-hidden="true"
                        ></div>


                        <!-- =================================
                             PROGRESS
                             ================================= -->

                        <div
                            class="short-progress-container"
                        >

                            <div
                                id="shortProgress"
                                class="short-progress"
                            ></div>

                        </div>


                        <!-- =================================
                             INFO
                             ================================= -->

                        <div
                            class="short-content"
                        >


                            <!-- CHANNEL -->

                            <div
                                class="short-channel-row"
                            >

                                <a
                                    id="shortChannelLink"
                                    href="#"
                                    class="short-channel-link"
                                >

                                    <img
                                        id="shortChannelAvatar"
                                        class="short-channel-avatar"
                                        src="NetView_icone.png"
                                        alt=""
                                    >

                                </a>


                                <div
                                    class="short-channel-info"
                                >

                                    <a
                                        id="shortChannelName"
                                        href="#"
                                        class="short-channel-name"
                                    >
                                        Chaîne
                                    </a>


                                    <span
                                        id="shortChannelVerified"
                                        class="short-channel-verified"
                                        hidden
                                    >

                                        <i class="fa-solid fa-circle-check"></i>

                                    </span>

                                </div>


                                <button
                                    id="shortSubscribeButton"
                                    class="short-subscribe-button"
                                    type="button"
                                >
                                    S'abonner
                                </button>

                            </div>


                            <!-- TITLE -->

                            <h1
                                id="shortTitle"
                                class="short-title"
                            ></h1>


                            <!-- DESCRIPTION -->

                            <button
                                id="shortDescriptionButton"
                                class="short-description-button"
                                type="button"
                            >

                                <span
                                    id="shortDescription"
                                ></span>

                            </button>


                            <!-- TAGS -->

                            <div
                                id="shortTags"
                                class="short-tags"
                            ></div>


                        </div>


                        <!-- =================================
                             SOUND
                             ================================= -->

                        <button
                            id="shortMuteButton"
                            class="short-media-control short-mute-button"
                            type="button"
                            aria-label="Son"
                        >

                            <i class="fa-solid fa-volume-high"></i>

                        </button>


                        <!-- =================================
                             FULLSCREEN
                             ================================= -->

                        <button
                            id="shortFullscreenButton"
                            class="short-media-control short-fullscreen-button"
                            type="button"
                            aria-label="Plein écran"
                        >

                            <i class="fa-solid fa-expand"></i>

                        </button>

                    </div>


                    <!-- =====================================
                         ACTIONS
                         ===================================== -->

                    <aside
                        class="short-actions"
                        aria-label="Actions"
                    >


                        <!-- LIKE -->

                        <button
                            id="shortLikeButton"
                            class="short-action"
                            type="button"
                            aria-label="J'aime"
                        >

                            <span class="short-action-icon">

                                <i class="fa-regular fa-thumbs-up"></i>

                            </span>

                            <span
                                id="shortLikeCount"
                                class="short-action-count"
                            >
                                0
                            </span>

                        </button>


                        <!-- COMMENTS -->

                        <button
                            id="shortCommentsButton"
                            class="short-action"
                            type="button"
                            aria-label="Commentaires"
                        >

                            <span class="short-action-icon">

                                <i class="fa-regular fa-comment"></i>

                            </span>

                            <span
                                id="shortCommentCount"
                                class="short-action-count"
                            >
                                0
                            </span>

                        </button>


                        <!-- SHARE -->

                        <button
                            id="shortShareButton"
                            class="short-action"
                            type="button"
                            aria-label="Partager"
                        >

                            <span class="short-action-icon">

                                <i class="fa-solid fa-share"></i>

                            </span>

                            <span class="short-action-label">
                                Partager
                            </span>

                        </button>


                        <!-- SAVE -->

                        <button
                            id="shortSaveButton"
                            class="short-action"
                            type="button"
                            aria-label="Enregistrer"
                        >

                            <span class="short-action-icon">

                                <i class="fa-regular fa-bookmark"></i>

                            </span>

                            <span class="short-action-label">
                                Enregistrer
                            </span>

                        </button>


                        <!-- MORE -->

                        <button
                            id="shortMoreButton"
                            class="short-action"
                            type="button"
                            aria-label="Plus"
                        >

                            <span class="short-action-icon">

                                <i class="fa-solid fa-ellipsis"></i>

                            </span>

                        </button>


                        <!-- CHANNEL AVATAR -->

                        <a
                            id="shortActionChannel"
                            href="#"
                            class="short-action-avatar"
                            aria-label="Chaîne"
                        >

                            <img
                                id="shortActionChannelAvatar"
                                src="NetView_icone.png"
                                alt=""
                            >

                        </a>

                    </aside>


                </article>


                <!-- =========================================
                     NEXT
                     ========================================= -->

                <button
                    id="nextShortButton"
                    class="short-nav-button short-nav-down"
                    type="button"
                    aria-label="Short suivant"
                >

                    <i class="fa-solid fa-chevron-down"></i>

                </button>


            </section>


            <!-- =============================================
                 MOBILE SWIPE TARGET
                 ============================================= -->

            <div
                id="shortSwipeArea"
                class="short-swipe-area"
                aria-hidden="true"
            ></div>

        </main>


        <!-- =================================================
             COMMENTS PANEL
             ================================================= -->

        <aside
            id="shortCommentsPanel"
            class="short-comments-panel"
            aria-hidden="true"
            hidden
        >

            <header
                class="short-comments-header"
            >

                <div>

                    <h2>
                        Commentaires
                    </h2>

                    <span
                        id="shortCommentsTotal"
                    >
                        0
                    </span>

                </div>


                <button
                    id="closeShortComments"
                    class="nv-icon-button"
                    type="button"
                    aria-label="Fermer"
                >

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </header>


            <!-- =============================================
                 COMMENT FORM
                 ============================================= -->

            <form
                id="shortCommentForm"
                class="short-comment-form"
            >

                <img
                    id="shortCommentAvatar"
                    class="short-comment-user-avatar"
                    src="NetView_icone.png"
                    alt=""
                >


                <div
                    class="short-comment-input-container"
                >

                    <textarea
                        id="shortCommentInput"
                        name="content"
                        maxlength="5000"
                        rows="1"
                        placeholder="Ajouter un commentaire..."
                    ></textarea>


                    <div
                        class="short-comment-actions"
                    >

                        <button
                            id="cancelShortComment"
                            type="button"
                            class="nv-button nv-button-secondary"
                            hidden
                        >
                            Annuler
                        </button>


                        <button
                            id="submitShortComment"
                            type="submit"
                            class="nv-button nv-button-primary"
                        >
                            Commenter
                        </button>

                    </div>

                </div>

            </form>


            <!-- =============================================
                 COMMENTS
                 ============================================= -->

            <div
                id="shortCommentsList"
                class="short-comments-list"
            >

                <div
                    id="shortCommentsLoading"
                    class="short-comments-loading"
                    hidden
                >

                    <div class="nv-loader"></div>

                </div>


                <div
                    id="shortCommentsEmpty"
                    class="short-comments-empty"
                    hidden
                >

                    <i class="fa-regular fa-comment"></i>

                    <p>
                        Aucun commentaire pour le moment.
                    </p>

                </div>

            </div>

        </aside>


        <!-- =================================================
             COMMENTS OVERLAY
             ================================================= -->

        <div
            id="shortCommentsOverlay"
            class="short-comments-overlay"
            hidden
        ></div>


        <!-- =================================================
             SHARE
             ================================================= -->

        <div
            id="shortShareModal"
            class="short-share-modal"
            hidden
        >

            <div
                class="short-share-backdrop"
                data-close-share
            ></div>


            <div
                class="short-share-dialog"
                role="dialog"
                aria-modal="true"
                aria-labelledby="shortShareTitle"
            >

                <header
                    class="short-share-dialog-header"
                >

                    <h2 id="shortShareTitle">
                        Partager
                    </h2>


                    <button
                        id="closeShortShare"
                        class="nv-icon-button"
                        type="button"
                        aria-label="Fermer"
                    >

                        <i class="fa-solid fa-xmark"></i>

                    </button>

                </header>


                <div
                    class="short-share-options"
                >

                    <button
                        id="nativeShortShare"
                        type="button"
                        class="short-share-option"
                    >

                        <i class="fa-solid fa-share-nodes"></i>

                        <span>
                            Partager
                        </span>

                    </button>


                    <button
                        id="copyShortLink"
                        type="button"
                        class="short-share-option"
                    >

                        <i class="fa-solid fa-link"></i>

                        <span>
                            Copier le lien
                        </span>

                    </button>

                </div>

            </div>

        </div>


        <!-- =================================================
             MORE MENU
             ================================================= -->

        <div
            id="shortMoreMenu"
            class="short-more-menu"
            hidden
        >

            <button
                id="shortReportButton"
                type="button"
            >

                <i class="fa-regular fa-flag"></i>

                <span>
                    Signaler
                </span>

            </button>


            <button
                id="shortNotInterestedButton"
                type="button"
            >

                <i class="fa-regular fa-eye-slash"></i>

                <span>
                    Pas intéressé
                </span>

            </button>

        </div>


        <!-- =================================================
             TOAST
             ================================================= -->

        <div
            id="nvToast"
            class="nv-toast"
            role="status"
            aria-live="polite"
            hidden
        >

            <span
                id="nvToastMessage"
            ></span>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        type="module"
        src="js/pages/shorts.js"
    ></script>

</body>

</html>
