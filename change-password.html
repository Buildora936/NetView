<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changement de mot de passe - NetView</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Core CSS -->
    <link rel="stylesheet" href="CSS/core/variables.css">
    <link rel="stylesheet" href="CSS/core/reset.css">
    <link rel="stylesheet" href="CSS/core/typography.css">
    <link rel="stylesheet" href="CSS/core/animations.css">

    <!-- Components -->
    <link rel="stylesheet" href="CSS/components/buttons.css">
    <link rel="stylesheet" href="CSS/components/forms.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="CSS/pages/change-password.css">
</head>

<body>

<!-- Background Animated -->
<div class="netview-background"></div>

<!-- Global Loader -->
<div id="globalLoader" class="global-loader">
    <div class="loader-circle"></div>
</div>

<main class="change-page">
    <section class="change-card">

        <!-- Logo -->
        <div class="change-logo">
            <img src="NetView.png" alt="NetView">
        </div>

        <h1>Nouveau mot de passe</h1>
        <p class="change-description">
            Veuillez entrer votre nouveau mot de passe sécurisé.
        </p>

        <!-- Form -->
        <form id="changeForm" class="change-form">
            
            <div class="form-group">
                <label for="password">Nouveau mot de passe</label>
                <div class="input-container">
                    <i class="fa-solid fa-lock"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        autocomplete="new-password"
                        required
                    >
                    <button type="button" id="togglePassword" class="password-toggle" aria-label="Afficher le mot de passe">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmer le mot de passe</label>
                <div class="input-container">
                    <i class="fa-solid fa-lock"></i>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="••••••••" 
                        autocomplete="new-password"
                        required
                    >
                </div>
                <div id="changeError" class="error"></div>
            </div>

            <div class="change-buttons">
                <button type="submit" id="submitButton" class="nv-btn nv-btn-primary">
                    <span id="submitText">Mettre à jour le mot de passe</span>
                    <span id="submitLoader" hidden>Mise à jour...</span>
                </button>
            </div>

        </form>

    </section>
</main>

<!-- Notification -->
<div id="notification" class="notification"></div>

<!-- Scripts -->
<script type="module" src="js/pages/change-password.js"></script>

</body>
</html>
