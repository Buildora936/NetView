<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Découvrez les contenus les plus populaires sur NetView."
    >

    <meta
        name="theme-color"
        content="#2563EB"
    >

    <title>
        Tendances - NetView
    </title>


    <!-- ==========================================
    Font Awesome
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==========================================
    Core CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="CSS/core/variables.css"
    >

    <link
        rel="stylesheet"
        href="CSS/core/reset.css"
    >

    <link
        rel="stylesheet"
        href="CSS/core/typography.css"
    >

    <link
        rel="stylesheet"
        href="CSS/core/animations.css"
    >

    <link
        rel="stylesheet"
        href="CSS/core/utilities.css"
    >


    <!-- ==========================================
    Components CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="CSS/components/buttons.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/cards.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/forms.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/modal.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/toast.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/header.css"
    >

    <link
        rel="stylesheet"
        href="CSS/components/loader.css"
    >


    <!-- ==========================================
    Trending CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="CSS/pages/trending.css"
    >

</head>


<body>


<!-- ==========================================
NetView Background
========================================== -->

<div
    class="nv-home-background"
    aria-hidden="true">

    <div class="nv-orb nv-orb-one"></div>

    <div class="nv-orb nv-orb-two"></div>

    <div class="nv-orb nv-orb-three"></div>

</div>

<!-- ==========================================
Header
========================================== -->

<header class="nv-header">

    <div class="nv-header-left">

        <button
            id="menuButton"
            class="nv-icon-button"
            aria-label="Menu">

            <i class="fa-solid fa-bars"></i>

        </button>

        <a
            href="index.html"
            class="nv-logo">

            <img
                src="NetView.png"
                alt="NetView">

        </a>

    </div>

    <div class="nv-header-center">

        <form
            id="searchForm"
            class="nv-search-form">

            <input
                id="searchInput"
                class="nv-search-input"
                type="search"
                placeholder="Rechercher">

            <button
                class="nv-search-button"
                type="submit">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </form>

    </div>

    <div
        id="headerRight"
        class="nv-header-right">

        <!-- Rempli dynamiquement par index.js -->

    </div>

</header>

<!-- ==========================================
Sidebar
========================================== -->

<aside
    id="sidebar"
    class="nv-sidebar">

    <nav class="nv-sidebar-nav">

        <!-- Généré par index.js -->

    </nav>

</aside>

<!-- ==========================================
Mobile Overlay
========================================== -->

<div
    id="sidebarOverlay"
    class="nv-sidebar-overlay">

</div>
<!-- ==========================================
Categories
========================================== -->

<section class="nv-categories">

<div
    class="nv-categories-scroll">

<button
    class="nv-category active">

Tous

</button>

<!-- Les catégories seront générées par index.js -->

</div>

</section>

<!-- ==========================================
Main
========================================== -->

<main class="nv-home">



<!-- Notification -->
    <div id="notification" class="notification"></div>


<!-- ==========================================
Scripts
========================================== -->

<script
    type="module"
    src="js/pages/trending.js">
</script>


</body>

</html>
