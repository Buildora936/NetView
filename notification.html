<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consultez toutes vos notifications NetView : nouvelles vidéos, lives, abonnements, messages et activités de votre compte.">
    <meta name="theme-color" content="#2563EB">
    <meta name="color-scheme" content="dark">
    <title>Notifications - NetView</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="NetView_icone.png">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- NetView CSS Core -->
    <link rel="stylesheet" href="CSS/core/variables.css">
    <link rel="stylesheet" href="CSS/core/reset.css">
    <link rel="stylesheet" href="CSS/core/typography.css">
    <link rel="stylesheet" href="CSS/core/animations.css">
    <link rel="stylesheet" href="CSS/core/utilities.css">

    <!-- NetView Components -->
    <link rel="stylesheet" href="CSS/components/buttons.css">
    <link rel="stylesheet" href="CSS/components/cards.css">
    <link rel="stylesheet" href="CSS/components/modal.css">
    <link rel="stylesheet" href="CSS/components/toast.css">
    <link rel="stylesheet" href="CSS/components/sidebar.css">
    <link rel="stylesheet" href="CSS/components/header.css">
    <link rel="stylesheet" href="CSS/components/footer.css">
    <link rel="stylesheet" href="CSS/components/loader.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="CSS/pages/notification.css">
</head>

<body class="netview-page notifications-page" data-page="notifications">
    <!-- Application -->
    <div id="app" class="app">


        <!-- ==========================================
Header
========================================== -->

<header class="nv-header">

    <div class="nv-header-left">

        <button
            id="menuButton"
            class="nv-icon-button"
            aria-label="Menu">

            <i class="fa-solid fa-bars"></i>

        </button>

        <a
            href="index.html"
            class="nv-logo">

            <img
                src="NetView.png"
                alt="NetView">

        </a>

    </div>

    <div class="nv-header-center">

        <form
            id="searchForm"
            class="nv-search-form">

            <input
                id="searchInput"
                class="nv-search-input"
                type="search"
                placeholder="Rechercher">

            <button
                class="nv-search-button"
                type="submit">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </form>

    </div>

    <div
        id="headerRight"
        class="nv-header-right">

        <!-- Rempli dynamiquement par index.js -->

    </div>

</header>

<!-- ==========================================
Sidebar
========================================== -->

<aside
    id="sidebar"
    class="nv-sidebar">

    <nav class="nv-sidebar-nav">

        <!-- Généré par index.js -->

    </nav>

</aside>

<!-- ==========================================
Mobile Overlay
========================================== -->

<div
    id="sidebarOverlay"
    class="nv-sidebar-overlay">

</div>
                   
            <!-- PAGE CONTENT -->
            <main id="main-content" class="page-content">

                <!-- PAGE HEADER -->
                <section class="page-header notifications-header">
                    <div class="page-header-content">
                        <div class="page-title-wrapper">
                            <div class="page-title-icon" aria-hidden="true">
                                <i class="fa-solid fa-bell"></i>
                            </div>
                            <div>
                                <h1 class="page-title">Notifications</h1>
                                <p class="page-subtitle">Retrouvez toute votre activité NetView au même endroit.</p>
                            </div>
                        </div>

                        <!-- Mark all read -->
                        <button type="button" class="btn btn-secondary mark-all-read-button" id="mark-all-read-button" disabled>
                            <i class="fa-solid fa-check-double"></i>
                            <span>Tout marquer comme lu</span>
                        </button>
                    </div>
                </section>

                <!-- NOTIFICATION TOOLBAR -->
                <section class="notifications-toolbar" aria-label="Filtres des notifications">
                    <div class="notification-filters" role="tablist" aria-label="Filtrer les notifications">
                        <button type="button" class="notification-filter active" data-filter="all" role="tab" aria-selected="true">
                            <i class="fa-solid fa-inbox"></i>
                            <span>Toutes</span>
                            <span class="filter-count" id="all-count" hidden>0</span>
                        </button>
                        <button type="button" class="notification-filter" data-filter="unread" role="tab" aria-selected="false">
                            <i class="fa-solid fa-envelope"></i>
                            <span>Non lues</span>
                            <span class="filter-count" id="unread-count" hidden>0</span>
                        </button>
                        <button type="button" class="notification-filter" data-filter="mentions" role="tab" aria-selected="false">
                            <i class="fa-solid fa-at"></i>
                            <span>Mentions</span>
                        </button>
                        <button type="button" class="notification-filter" data-filter="activity" role="tab" aria-selected="false">
                            <i class="fa-solid fa-bolt"></i>
                            <span>Activité</span>
                        </button>
                        <button type="button" class="notification-filter" data-filter="netview" role="tab" aria-selected="false">
                            <i class="fa-solid fa-circle-info"></i>
                            <span>NetView</span>
                        </button>
                    </div>

                    <!-- Notification settings -->
                    <a href="settings.html#notifications" class="notification-settings-link">
                        <i class="fa-solid fa-gear"></i>
                        <span>Paramètres</span>
                    </a>
                </section>

                <!-- NOTIFICATION CONTENT -->
                <section class="notifications-section" aria-label="Liste des notifications">
                    <div class="notifications-list" id="notifications-list" aria-live="polite">

                        <!-- LOADING SKELETON -->
                        <div class="notifications-loading" id="notifications-loading">
                            <article class="notification-skeleton">
                                <div class="skeleton skeleton-avatar"></div>
                                <div class="skeleton-content">
                                    <div class="skeleton skeleton-line skeleton-line-large"></div>
                                    <div class="skeleton skeleton-line skeleton-line-medium"></div>
                                    <div class="skeleton skeleton-line skeleton-line-small"></div>
                                </div>
                                <div class="skeleton skeleton-thumbnail"></div>
                            </article>
                            <article class="notification-skeleton">
                                <div class="skeleton skeleton-avatar"></div>
                                <div class="skeleton-content">
                                    <div class="skeleton skeleton-line skeleton-line-large"></div>
                                    <div class="skeleton skeleton-line skeleton-line-medium"></div>
                                    <div class="skeleton skeleton-line skeleton-line-small"></div>
                                </div>
                                <div class="skeleton skeleton-thumbnail"></div>
                            </article>
                            <article class="notification-skeleton">
                                <div class="skeleton skeleton-avatar"></div>
                                <div class="skeleton-content">
                                    <div class="skeleton skeleton-line skeleton-line-large"></div>
                                    <div class="skeleton skeleton-line skeleton-line-medium"></div>
                                    <div class="skeleton skeleton-line skeleton-line-small"></div>
                                </div>
                                <div class="skeleton skeleton-thumbnail"></div>
                            </article>
                            <article class="notification-skeleton">
                                <div class="skeleton skeleton-avatar"></div>
                                <div class="skeleton-content">
                                    <div class="skeleton skeleton-line skeleton-line-large"></div>
                                    <div class="skeleton skeleton-line skeleton-line-medium"></div>
                                    <div class="skeleton skeleton-line skeleton-line-small"></div>
                                </div>
                                <div class="skeleton skeleton-thumbnail"></div>
                            </article>
                        </div>

                    </div>
                </section>

            </main>
        </div>
    </div>
    <div id="notifications-empty" hidden></div>
<div id="notifications-error" hidden></div>
<script type="module" src="js/pages/notification.js"></script>
</body>
</html>
