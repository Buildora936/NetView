<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consultez toutes vos notifications NetView : nouvelles vidéos, lives, abonnements, messages et activités de votre compte.">
    <meta name="theme-color" content="#2563EB">
    <meta name="color-scheme" content="dark">
    <title>Notifications - NetView</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="NetView_icone.png">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- NetView CSS Core -->
    <link rel="stylesheet" href="CSS/core/variables.css">
    <link rel="stylesheet" href="CSS/core/reset.css">
    <link rel="stylesheet" href="CSS/core/typography.css">
    <link rel="stylesheet" href="CSS/core/animations.css">
    <link rel="stylesheet" href="CSS/core/utilities.css">

    <!-- NetView Components -->
    <link rel="stylesheet" href="CSS/components/buttons.css">
    <link rel="stylesheet" href="CSS/components/cards.css">
    <link rel="stylesheet" href="CSS/components/modal.css">
    <link rel="stylesheet" href="CSS/components/toast.css">
    <link rel="stylesheet" href="CSS/components/sidebar.css">
    <link rel="stylesheet" href="CSS/components/header.css">
    <link rel="stylesheet" href="CSS/components/footer.css">
    <link rel="stylesheet" href="CSS/components/loader.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="CSS/pages/notification.css">
</head>

<body class="netview-page notifications-page" data-page="notifications">
    <!-- Application -->
    <div id="app" class="app">

        <!-- HEADER -->
        <header id="site-header" class="site-header">
            <div class="header-inner">
                <!-- Mobile menu -->
                <button type="button" class="header-menu-button" id="mobile-menu-button" aria-label="Ouvrir le menu" aria-expanded="false">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <!-- Logo -->
                <a href="index.html" class="brand" aria-label="NetView - Accueil">
                    <img src="NetView.png" alt="NetView" class="brand-logo">
                </a>

                <!-- Search -->
                <form class="header-search" id="global-search-form" role="search">
                    <div class="search-input-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                        <input type="search" id="global-search-input" name="q" class="search-input" placeholder="Rechercher sur NetView" autocomplete="off" aria-label="Rechercher sur NetView">
                        <button type="button" class="search-clear-button" id="search-clear-button" aria-label="Effacer la recherche" hidden>
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <button type="submit" class="search-submit-button" aria-label="Rechercher">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>

                <!-- Header actions -->
                <div class="header-actions">
                    <!-- Search mobile -->
                    <button type="button" class="header-action-button mobile-search-button" id="mobile-search-button" aria-label="Rechercher">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                    <!-- Create -->
                    <a href="publish.html" class="header-action-button create-button" aria-label="Créer">
                        <i class="fa-solid fa-plus"></i>
                        <span>Créer</span>
                    </a>

                    <!-- Notifications -->
                    <button type="button" class="header-action-button notification-button active" id="header-notification-button" aria-label="Notifications" aria-current="page">
                        <i class="fa-regular fa-bell"></i>
                        <span class="notification-count" id="header-notification-count" hidden>0</span>
                    </button>

                    <!-- Profile -->
                    <button type="button" class="header-profile-button" id="header-profile-button" aria-label="Ouvrir le menu du profil" aria-expanded="false">
                        <img id="header-avatar" class="header-avatar" src="images/default-avatar.png" alt="Profil">
                    </button>
                </div>
            </div>

            <!-- Mobile search -->
            <div class="mobile-search-container" id="mobile-search-container" hidden>
                <form id="mobile-search-form" class="mobile-search-form" role="search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="mobile-search-input" placeholder="Rechercher sur NetView" autocomplete="off">
                    <button type="button" id="mobile-search-close" aria-label="Fermer la recherche">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </form>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <div class="main-layout">

            <!-- SIDEBAR -->
            <aside id="sidebar" class="sidebar" aria-label="Navigation principale">
                <nav class="sidebar-navigation">
                    <a href="index.html" class="sidebar-item">
                        <i class="fa-solid fa-house"></i>
                        <span>Accueil</span>
                    </a>
                    <a href="shorts.html" class="sidebar-item">
                        <i class="fa-solid fa-clapperboard"></i>
                        <span>Shorts</span>
                    </a>
                    <a href="subscriptions.html" class="sidebar-item">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>Abonnements</span>
                    </a>
                    <a href="notification.html" class="sidebar-item active" aria-current="page">
                        <i class="fa-solid fa-bell"></i>
                        <span>Notifications</span>
                        <span class="sidebar-badge" id="sidebar-notification-count" hidden>0</span>
                    </a>
                    <a href="library.html" class="sidebar-item">
                        <i class="fa-solid fa-photo-film"></i>
                        <span>Bibliothèque</span>
                    </a>
                    <a href="library.html#history" class="sidebar-item">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span>Historique</span>
                    </a>
                    <a href="library.html#watch-later" class="sidebar-item">
                        <i class="fa-regular fa-clock"></i>
                        <span>À regarder plus tard</span>
                    </a>
                    <a href="playlist.html" class="sidebar-item">
                        <i class="fa-solid fa-list"></i>
                        <span>Playlists</span>
                    </a>

                    <div class="sidebar-divider"></div>

                    <a href="mes-channel.html" class="sidebar-item">
                        <i class="fa-solid fa-tv"></i>
                        <span>Mes chaînes</span>
                    </a>
                    <a href="lives.html" class="sidebar-item">
                        <i class="fa-solid fa-tower-broadcast"></i>
                        <span>Lives</span>
                    </a>
                    <a href="netview-shop.html" class="sidebar-item">
                        <i class="fa-solid fa-store"></i>
                        <span>NetView Shop</span>
                    </a>

                    <div class="sidebar-divider"></div>

                    <a href="studio.html" class="sidebar-item">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Studio</span>
                    </a>
                    <a href="messages.html" class="sidebar-item">
                        <i class="fa-regular fa-message"></i>
                        <span>Messages</span>
                    </a>
                </nav>

                <!-- Sidebar footer -->
                <div class="sidebar-footer">
                    <a href="settings.html" class="sidebar-item">
                        <i class="fa-solid fa-gear"></i>
                        <span>Paramètres</span>
                    </a>
                    <a href="help.html" class="sidebar-item">
                        <i class="fa-regular fa-circle-question"></i>
                        <span>Aide</span>
                    </a>
                </div>
            </aside>

            <!-- PAGE CONTENT -->
            <main id="main-content" class="page-content">

                <!-- PAGE HEADER -->
                <section class="page-header notifications-header">
                    <div class="page-header-content">
                        <div class="page-title-wrapper">
                            <div class="page-title-icon" aria-hidden="true">
                                <i class="fa-solid fa-bell"></i>
                            </div>
                            <div>
                                <h1 class="page-title">Notifications</h1>
                                <p class="page-subtitle">Retrouvez toute votre activité NetView au même endroit.</p>
                            </div>
                        </div>

                        <!-- Mark all read -->
                        <button type="button" class="btn btn-secondary mark-all-read-button" id="mark-all-read-button" disabled>
                            <i class="fa-solid fa-check-double"></i>
                            <span>Tout marquer comme lu</span>
                        </button>
                    </div>
                </section>

                <!-- NOTIFICATION TOOLBAR -->
                <section class="notifications-toolbar" aria-label="Filtres des notifications">
                    <div class="notification-filters" role="tablist" aria-label="Filtrer les notifications">
                        <button type="button" class="notification-filter active" data-filter="all" role="tab" aria-selected="true">
                            <i class="fa-solid fa-inbox"></i>
                            <span>Toutes</span>
                            <span class="filter-count" id="all-count" hidden>0</span>
                        </button>
                        <button type="button" class="notification-filter" data-filter="unread" role="tab" aria-selected="false">
                            <i class="fa-solid fa-envelope"></i>
                            <span>Non lues</span>
                            <span class="filter-count" id="unread-count" hidden>0</span>
                        </button>
                        <button type="button" class="notification-filter" data-filter="mentions" role="tab" aria-selected="false">
                            <i class="fa-solid fa-at"></i>
                            <span>Mentions</span>
                        </button>
                        <button type="button" class="notification-filter" data-filter="activity" role="tab" aria-selected="false">
                            <i class="fa-solid fa-bolt"></i>
                            <span>Activité</span>
                        </button>
                        <button type="button" class="notification-filter" data-filter="netview" role="tab" aria-selected="false">
                            <i class="fa-solid fa-circle-info"></i>
                            <span>NetView</span>
                        </button>
                    </div>

                    <!-- Notification settings -->
                    <a href="settings.html#notifications" class="notification-settings-link">
                        <i class="fa-solid fa-gear"></i>
                        <span>Paramètres</span>
                    </a>
                </section>

                <!-- NOTIFICATION CONTENT -->
                <section class="notifications-section" aria-label="Liste des notifications">
                    <div class="notifications-list" id="notifications-list" aria-live="polite">

                        <!-- LOADING SKELETON -->
                        <div class="notifications-loading" id="notifications-loading">
                            <article class="notification-skeleton">
                                <div class="skeleton skeleton-avatar"></div>
                                <div class="skeleton-content">
                                    <div class="skeleton skeleton-line skeleton-line-large"></div>
                                    <div class="skeleton skeleton-line skeleton-line-medium"></div>
                                    <div class="skeleton skeleton-line skeleton-line-small"></div>
                                </div>
                                <div class="skeleton skeleton-thumbnail"></div>
                            </article>
                            <article class="notification-skeleton">
                                <div class="skeleton skeleton-avatar"></div>
                                <div class="skeleton-content">
                                    <div class="skeleton skeleton-line skeleton-line-large"></div>
                                    <div class="skeleton skeleton-line skeleton-line-medium"></div>
                                    <div class="skeleton skeleton-line skeleton-line-small"></div>
                                </div>
                                <div class="skeleton skeleton-thumbnail"></div>
                            </article>
                            <article class="notification-skeleton">
                                <div class="skeleton skeleton-avatar"></div>
                                <div class="skeleton-content">
                                    <div class="skeleton skeleton-line skeleton-line-large"></div>
                                    <div class="skeleton skeleton-line skeleton-line-medium"></div>
                                    <div class="skeleton skeleton-line skeleton-line-small"></div>
                                </div>
                                <div class="skeleton skeleton-thumbnail"></div>
                            </article>
                            <article class="notification-skeleton">
                                <div class="skeleton skeleton-avatar"></div>
                                <div class="skeleton-content">
                                    <div class="skeleton skeleton-line skeleton-line-large"></div>
                                    <div class="skeleton skeleton-line skeleton-line-medium"></div>
                                    <div class="skeleton skeleton-line skeleton-line-small"></div>
                                </div>
                                <div class="skeleton skeleton-thumbnail"></div>
                            </article>
                        </div>

                    </div>
                </section>

            </main>
        </div>
    </div>
</body>
</html>
