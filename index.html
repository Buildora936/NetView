<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<meta
    name="description"
    content="NetView - Regardez des vidéos, des Shorts, des Lives et découvrez des créateurs.">

<meta
    name="theme-color"
    content="#2563EB">

<title>

Accueil • NetView

</title>

<!-- ==========================================
Favicon
========================================== -->

<link
    rel="icon"
    href="NetView_icone.png">

<!-- ==========================================
Font Awesome
========================================== -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- ==========================================
Core CSS
========================================== -->

<link
    rel="stylesheet"
    href="CSS/core/reset.css">

<link
    rel="stylesheet"
    href="CSS/core/variables.css">

<link
    rel="stylesheet"
    href="CSS/core/typography.css">

<link
    rel="stylesheet"
    href="CSS/core/utilities.css">

<link
    rel="stylesheet"
    href="CSS/core/animations.css">

<!-- ==========================================
Components
========================================== -->

<link
    rel="stylesheet"
    href="CSS/components/header.css">

<link
    rel="stylesheet"
    href="CSS/components/sidebar.css">

<link
    rel="stylesheet"
    href="CSS/components/buttons.css">

<link
    rel="stylesheet"
    href="CSS/components/cards.css">

<link
    rel="stylesheet"
    href="CSS/components/modal.css">

<link
    rel="stylesheet"
    href="CSS/components/toast.css">

<link
    rel="stylesheet"
    href="CSS/components/loader.css">

<!-- ==========================================
Page CSS
========================================== -->

<link
    rel="stylesheet"
    href="CSS/pages/index.css">

</head>

<body>
<!-- ==========================================
Animated Background
========================================== -->

<div
    class="nv-home-background">

    <div class="nv-orb one"></div>

    <div class="nv-orb two"></div>

    <div class="nv-orb three"></div>

</div>
<!-- ==========================================
Header
========================================== -->

<header class="nv-header">

    <div class="nv-header-left">

        <button
            id="menuButton"
            class="nv-icon-button"
            aria-label="Menu">

            <i class="fa-solid fa-bars"></i>

        </button>

        <a
            href="index.html"
            class="nv-logo">

            <img
                src="NetView.png"
                alt="NetView">

        </a>

    </div>

    <div class="nv-header-center">

        <form
            id="searchForm"
            class="nv-search-form">

            <input
                id="searchInput"
                class="nv-search-input"
                type="search"
                placeholder="Rechercher">

            <button
                class="nv-search-button"
                type="submit">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </form>

    </div>

    <div
        id="headerRight"
        class="nv-header-right">

        <!-- Rempli dynamiquement par index.js -->

    </div>

</header>

<!-- ==========================================
Sidebar
========================================== -->

<aside
    id="sidebar"
    class="nv-sidebar">

    <nav class="nv-sidebar-nav">

        <!-- Généré par index.js -->

    </nav>

</aside>

<!-- ==========================================
Mobile Overlay
========================================== -->

<div
    id="sidebarOverlay"
    class="nv-sidebar-overlay">

</div>
<!-- ==========================================
Categories
========================================== -->

<section class="nv-categories">

<div
    class="nv-categories-scroll">

<button
    class="nv-category active">

Tous

</button>

<!-- Les catégories seront générées par index.js -->

</div>

</section>

<!-- ==========================================
Main
========================================== -->

<main class="nv-home">

<!-- ==========================================
Videos Section
========================================== -->

<section
    class="nv-section">

<div
    id="videosGrid"
    class="nv-video-grid">

</div>

</section>

<!-- ==========================================
Shorts
========================================== -->

<section
    class="nv-section nv-shorts-section">

<div
    class="nv-section-header">

<div
    class="nv-section-title">

<i class="fa-solid fa-bolt"></i>



</div>

</div>

<div
    id="shortsGrid"
    class="nv-shorts-grid">

</div>

</section>

<!-- ==========================================
Videos Feed
========================================== -->

<section
    class="nv-section">

<div
    id="videosFeed"
    class="nv-video-grid">

</div>

</section>

<!-- ==========================================
Sponsored Products
========================================== -->

<section
    class="nv-section nv-products-section">

<div
    class="nv-section-header">

<div
    class="nv-section-title">

<i class="fa-solid fa-store"></i>


</div>

</div>

<div
    id="productsContainer"
    class="nv-horizontal-scroll">

</div>

</section>
<!-- ==========================================
Videos Feed Continue
========================================== -->

<section
    class="nv-section">

<div
    id="videosFeedContinue"
    class="nv-video-grid">

</div>

</section>


<!-- ==========================================
Lives
========================================== -->

<section
    class="nv-section nv-lives-section">

<div
    class="nv-section-header">

<div
    class="nv-section-title">

<i class="fa-solid fa-tower-broadcast"></i>

</div>

</div>


<div
    id="livesContainer"
    class="nv-horizontal-scroll">

</div>

</section>


<!-- ==========================================
Shorts Continue
========================================== -->

<section
    class="nv-section nv-shorts-section">

<div
    class="nv-section-header">

<div
    class="nv-section-title">

<i class="fa-solid fa-bolt"></i>

</div>

</div>


<div
    id="shortsGridContinue"
    class="nv-shorts-grid">

</div>

</section>


<!-- ==========================================
Videos Feed Before Infinite Scroll
========================================== -->

<section
    class="nv-section">

<div
    id="videosBeforeInfinite"
    class="nv-video-grid">

</div>

</section>
</section>
<!-- ==========================================
Infinite Scroll Loader
========================================== -->

<div
    id="infiniteLoader"
    class="nv-infinite-loader">

</div>


<!-- ==========================================
Skeleton Loaders
========================================== -->

<div
    id="skeletonContainer"
    class="nv-skeleton-container">

</div>


<!-- ==========================================
Empty States
========================================== -->

<div
    id="emptyState"
    class="nv-empty-state">

</div>


<!-- ==========================================
Context Menus
========================================== -->

<div
    id="contextMenu"
    class="nv-context-menu">

</div>


<!-- ==========================================
Full Page Loader
========================================== -->

<div
    class="nv-page-loader">

<div
    class="nv-loader">

</div>

</div>

<!-- Notification -->
    <div id="notification" class="notification"></div>

<!-- ==========================================
Scripts
========================================== -->

<script
    type="module"
    src="JS/pages/index.js">
</script>


</body>

</html>
