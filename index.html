<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NetView - Regardez des vidéos, des Shorts, des Lives et découvrez des créateurs.">
    <meta name="theme-color" content="#2563EB">
    <title>Accueil • NetView</title>
    
    <link rel="icon" href="NetView_icone.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="CSS/core/reset.css">
    <link rel="stylesheet" href="CSS/core/variables.css">
    <link rel="stylesheet" href="CSS/core/typography.css">
    <link rel="stylesheet" href="CSS/core/utilities.css">
    <link rel="stylesheet" href="CSS/core/animations.css">
    <link rel="stylesheet" href="CSS/components/header.css">
    <link rel="stylesheet" href="CSS/components/sidebar.css">
    <link rel="stylesheet" href="CSS/components/buttons.css">
    <link rel="stylesheet" href="CSS/components/cards.css">
    <link rel="stylesheet" href="CSS/components/modal.css">
    <link rel="stylesheet" href="CSS/components/toast.css">
    <link rel="stylesheet" href="CSS/pages/index.css">
</head>
<body>

<!-- Animated Background -->
<div class="nv-home-background">
    <div class="nv-orb one"></div>
    <div class="nv-orb two"></div>
    <div class="nv-orb three"></div>
</div>

<header class="nv-header">
    <div class="nv-header-left">
        <button id="menuButton" class="nv-icon-button" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <a href="index.html" class="nv-logo"><img src="NetView.png" alt="NetView"></a>
    </div>
    <div class="nv-header-center">
        <form id="searchForm" class="nv-search-form">
            <input id="searchInput" class="nv-search-input" type="search" placeholder="Rechercher">
            <button class="nv-search-button" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
    </div>
    <div id="headerRight" class="nv-header-right"></div>
</header>

<aside id="sidebar" class="nv-sidebar">
    <nav class="nv-sidebar-nav"></nav>
</aside>
<div id="sidebarOverlay" class="nv-sidebar-overlay"></div>

<!-- Categories -->
<!-- Categories -->
<section class="nv-categories">
    <div class="nv-categories-scroll" id="categoriesScroll">
    </div>
</section>

<main class="nv-home">

    <!-- Videos Section -->
    <section class="nv-section">
        <div id="videosGrid" class="nv-video-grid">...</div>
    </section>

    <!-- Shorts -->
    <section class="nv-section nv-shorts-section">
        <div class="nv-section-header"><div class="nv-section-title"><i class="fa-solid fa-bolt"></i> Shorts</div></div>
        <div id="shortsGrid" class="nv-shorts-grid">...</div>
               
    </section>

    <!-- Lives -->
    <section class="nv-section nv-lives-section">
        <div class="nv-section-header"><div class="nv-section-title"><i class="fa-solid fa-tower-broadcast"></i> Lives</div></div>
        <div id="livesContainer" class="nv-horizontal-scroll">...</div>
    </section>

    <!-- Products -->
    <section class="nv-section nv-products-section">
        <div class="nv-section-header"><div class="nv-section-title"><i class="fa-solid fa-store"></i> Produits</div></div>
        <div id="productsContainer" class="nv-horizontal-scroll">...</div>
    </section>

</main>

<div id="emptyState" class="nv-empty-state"></div>
<div id="contextMenu" class="nv-context-menu"></div>
<div id="notification" class="notification"></div>

<script type="module" src="js/pages/index.js"></script>
</body>
</html>
