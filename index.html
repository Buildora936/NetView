<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<meta
    name="description"
    content="NetView - Regardez des vidéos, des Shorts, des Lives et découvrez des créateurs.">

<meta
    name="theme-color"
    content="#2563EB">

<title>

Accueil • NetView

</title>

<!-- ==========================================
Favicon
========================================== -->

<link
    rel="icon"
    href="NetView_icone.png">

<!-- ==========================================
Font Awesome
========================================== -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- ==========================================
Core CSS
========================================== -->

<link
    rel="stylesheet"
    href="CSS/core/reset.css">

<link
    rel="stylesheet"
    href="CSS/core/variables.css">

<link
    rel="stylesheet"
    href="CSS/core/typography.css">

<link
    rel="stylesheet"
    href="CSS/core/utilities.css">

<link
    rel="stylesheet"
    href="CSS/core/animations.css">

<!-- ==========================================
Components
========================================== -->

<link
    rel="stylesheet"
    href="CSS/components/header.css">

<link
    rel="stylesheet"
    href="CSS/components/sidebar.css">

<link
    rel="stylesheet"
    href="CSS/components/buttons.css">

<link
    rel="stylesheet"
    href="CSS/components/cards.css">

<link
    rel="stylesheet"
    href="CSS/components/modal.css">

<link
    rel="stylesheet"
    href="CSS/components/toast.css">

<link
    rel="stylesheet"
    href="CSS/components/loader.css">

<!-- ==========================================
Page CSS
========================================== -->

<link
    rel="stylesheet"
    href="CSS/pages/index.css">

</head>

<body>

<!-- ==========================================
Animated Background
========================================== -->

<div class="nv-home-background">

    <div class="nv-orb one"></div>

    <div class="nv-orb two"></div>

    <div class="nv-orb three"></div>

</div>

<!-- ==========================================
Header
========================================== -->

<header class="nv-header">

    <div class="nv-header-left">

        <button
            id="menuButton"
            class="nv-icon-button"
            aria-label="Menu">

            <i class="fa-solid fa-bars"></i>

        </button>

        <a
            href="index.html"
            class="nv-logo">

            <img
                src="NetView.png"
                alt="NetView">

        </a>

    </div>

    <div class="nv-header-center">

        <form
            id="searchForm"
            class="nv-search-form">

            <input
                id="searchInput"
                class="nv-search-input"
                type="search"
                placeholder="Rechercher">

            <button
                class="nv-search-button"
                type="submit">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </form>

    </div>

    <div
        id="headerRight"
        class="nv-header-right">

        <!-- Rempli dynamiquement par index.js -->

    </div>

</header>

<!-- ==========================================
Sidebar
========================================== -->

<aside
    id="sidebar"
    class="nv-sidebar">

    <nav class="nv-sidebar-nav">

        <!-- Généré par index.js -->

    </nav>

</aside>

<!-- ==========================================
Mobile Overlay
========================================== -->

<div
    id="sidebarOverlay"
    class="nv-sidebar-overlay">

</div>
<!-- ==========================================
Categories
========================================== -->

<section class="nv-categories">

<div
    class="nv-categories-scroll">

<button
    class="nv-category active">

Tous

</button>

<!-- Les catégories seront générées par index.js -->

</div>

</section>

<!-- ==========================================
Main
========================================== -->

<main class="nv-home">

<!-- ==========================================
Videos Section
========================================== -->

<section
    class="nv-section">

<div
    id="videosGrid"
    class="nv-video-grid">

<!-- ==========================================
Video Card Template
========================================== -->

<article class="nv-video-card">

<a
    href="#"
    class="nv-video-link">

<div class="nv-video-thumbnail">

<img
    src="images/video-placeholder.jpg"
    alt="Miniature">

<span class="nv-video-duration">

12:35

</span>

</div>

</a>

<div class="nv-video-content">

<a
    href="#"
    class="nv-video-avatar">

<img
    src="assets/images/default-avatar.png"
    alt="Créateur">

</a>

<div class="nv-video-info">

<a
    href="#"
    class="nv-video-title">

Chargement...

</a>

<a
    href="#"
    class="nv-video-channel">

NetView

</a>

<div
    class="nv-video-meta">

<span>

0 vue

</span>

•

<span>

À l'instant

</span>

</div>

</div>

<button
    class="nv-video-menu">

<i class="fa-solid fa-ellipsis-vertical"></i>

</button>

</div>

</article>

<!-- Les autres vidéos seront générées par index.js -->

</div>

</section>
