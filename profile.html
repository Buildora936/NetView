<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Créer votre profil - NetView
    </title>


    <!-- Font Awesome -->

    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <!-- Core CSS -->

    <link 
        rel="stylesheet" 
        href="css/core/variables.css"
    >

    <link 
        rel="stylesheet" 
        href="css/core/reset.css"
    >

    <link 
        rel="stylesheet" 
        href="css/core/typography.css"
    >

    <link 
        rel="stylesheet" 
        href="css/core/animations.css"
    >


    <!-- Components -->

    <link 
        rel="stylesheet" 
        href="css/components/buttons.css"
    >

    <link 
        rel="stylesheet" 
        href="css/components/forms.css"
    >

    <link 
        rel="stylesheet" 
        href="css/components/toast.css"
    >


    <!-- Page CSS -->

    <link 
        rel="stylesheet" 
        href="css/pages/profile.css"
    >

</head>


<body>


<!-- ==========================================
Background Animated
========================================== -->

<div class="netview-background"></div>



<!-- ==========================================
Global Loader
========================================== -->

<div 
    id="globalLoader"
    class="global-loader"
>

    <div class="loader-circle"></div>

</div>



<!-- ==========================================
Profile Container
========================================== -->

<main class="profile-page">


<section class="profile-card">



<!-- ==========================================
Logo
========================================== -->

<div class="profile-logo">


    <img
        src="assets/images/NetView.png"
        alt="NetView"
    >


</div>



<!-- ==========================================
Title
========================================== -->

<h1>

    Créer votre profil

</h1>


<p class="profile-description">

    Personnalisez votre expérience sur NetView.

</p>



<!-- ==========================================
Avatar
========================================== -->

<div class="avatar-section">


    <div class="avatar-preview">


        <img
            id="avatarPreview"
            src="assets/images/default-avatar.png"
            alt="Avatar"
        >


        <button
            type="button"
            id="avatarButton"
            class="upload-button"
        >

            <i class="fa-solid fa-camera"></i>

        </button>


    </div>


    <input
        type="file"
        id="avatarInput"
        accept="image/png,image/jpeg,image/webp,image/gif"
        hidden
    >


    <p class="upload-info">

        Avatar optionnel

    </p>


</div>





<!-- ==========================================
Banner
========================================== -->


<div class="banner-section">


    <div 
        class="banner-preview"
        id="bannerPreview"
    >


        <img
            id="bannerImage"
            src=""
            alt="Bannière"
        >


        <button
            type="button"
            id="bannerButton"
            class="upload-button"
        >

            <i class="fa-solid fa-image"></i>

        </button>


    </div>



    <input
        type="file"
        id="bannerInput"
        accept="image/png,image/jpeg,image/webp,image/gif"
        hidden
    >


    <p class="upload-info">

        Bannière optionnelle

    </p>


</div>





<!-- ==========================================
Profile Form
========================================== -->


<form 
    id="profileForm"
    class="profile-form"
>




<!-- Username -->

<div class="form-group">


<label for="username">

    Nom d'utilisateur

</label>


<div class="input-container">


<i class="fa-solid fa-at"></i>


<input
    type="text"
    id="username"
    name="username"
    placeholder="username"
    autocomplete="username"
>


</div>


<p 
    id="usernameMessage"
    class="nv-help"
></p>


</div>





<!-- Display Name -->

<div class="form-group">


<label for="displayName">

    Nom complet

</label>


<div class="input-container">


<i class="fa-solid fa-user"></i>


<input
    type="text"
    id="displayName"
    name="displayName"
    placeholder="Votre nom affiché"
>


</div>


<p 
    id="displayNameMessage"
    class="nv-help"
></p>


</div>





<!-- Bio -->

<div class="form-group">


<label for="bio">

    Biographie

</label>


<textarea

    id="bio"

    name="bio"

    maxlength="500"

    placeholder="Parlez de vous..."

></textarea>


<div class="bio-counter">

    <span id="bioCounter">
        0
    </span>

    /500

</div>


</div>





<!-- Country -->

<div class="form-group">


<label for="country">

    Pays

</label>


<div class="input-container">


<i class="fa-solid fa-location-dot"></i>


<input

    type="text"

    id="country"

    name="country"

    readonly

>


</div>


</div>





<!-- Language -->

<div class="form-group">


<label for="language">

    Langue

</label>


<div class="input-container">


<i class="fa-solid fa-language"></i>


<select 
    id="language"
    name="language"
>


<option value="fr">

    Français

</option>


<option value="en">

    English

</option>


<option value="es">

    Español

</option>


<option value="pt">

    Português

</option>


<option value="de">

    Deutsch

</option>


<option value="it">

    Italiano

</option>


</select>


</div>


</div>
<!-- ==========================================
Informations du compte
========================================== -->

<div class="profile-info">


    <div class="info-item">


        <span>

            Adresse e-mail

        </span>


        <strong id="emailAddress"></strong>


    </div>


    <div class="info-item">


        <span>

            Compte vérifié

        </span>


        <strong id="verifiedBadge">

            Non vérifié

        </strong>


    </div>


    <div class="info-item">


        <span>

            Entreprise vérifiée

        </span>


        <strong id="companyVerifiedBadge">

            Non vérifiée

        </strong>


    </div>


</div>





<!-- ==========================================
Buttons
========================================== -->

<div class="profile-buttons">


<button
    type="submit"
    id="saveProfileButton"
    class="nv-btn nv-btn-primary"
>


<span
    id="saveProfileText"
>

    Enregistrer le profil

</span>


<span
    id="saveProfileLoader"
    hidden
>

    Enregistrement...

</span>


</button>


<button
    type="button"
    id="logoutButton"
    class="nv-btn nv-btn-secondary"
>

    Se déconnecter

</button>


</div>


</form>


</section>


</main>





<!-- ==========================================
Country Modal
========================================== -->

<div
    id="countryModal"
    class="country-modal"
>


<div class="country-box">


<div class="country-header">


<h2>

    Choisir un pays

</h2>


<button
    type="button"
    id="closeCountryModal"
>

    <i class="fa-solid fa-xmark"></i>

</button>


</div>



<input
    type="text"
    id="countrySearch"
    placeholder="Rechercher un pays..."
>


<div
    id="countryList"
    class="country-list"
></div>


</div>


</div>





<!-- ==========================================
Notification
========================================== -->

<div
    id="notification"
    class="notification"
></div>





<!-- ==========================================
Scripts
========================================== -->

<script
    type="module"
    src="js/core/supabase.js"
></script>

<script
    type="module"
    src="js/pages/profile.js"
></script>


</body>

</html>
