<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer votre profil - NetView</title>

    <link rel="icon" type="image/png" href="NetView_icone.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Core CSS -->
    <link rel="stylesheet" href="CSS/core/variables.css">
    <link rel="stylesheet" href="CSS/core/reset.css">
    <link rel="stylesheet" href="CSS/core/typography.css">
    <link rel="stylesheet" href="CSS/core/animations.css">
    <link rel="stylesheet" href="CSS/core/utilities.css">

    <!-- Components -->
    <link rel="stylesheet" href="CSS/components/buttons.css">
    <link rel="stylesheet" href="CSS/components/forms.css">
    <link rel="stylesheet" href="CSS/components/cards.css">
    <link rel="stylesheet" href="CSS/components/modal.css">
    <link rel="stylesheet" href="CSS/components/toast.css">
    <link rel="stylesheet" href="CSS/components/loader.css">

    <link rel="stylesheet" href="CSS/pages/profile.css">
</head>
<body>

<!-- ==========================================
Background Animated
========================================== -->
<div class="netview-background"></div>

<!-- ==========================================
Profile Container
========================================== -->
<main class="profile-page">
    <section class="profile-card">

        <!-- ==========================================
        Logo
        ========================================== -->
        <div class="profile-logo">
            <img src="NetView.png" alt="NetView">
        </div>

        <!-- ==========================================
        Title
        ========================================== -->
        <h1>Créer votre profil</h1>
        <p class="profile-description">Personnalisez votre expérience sur NetView.</p>

        <!-- ==========================================
        Avatar Section
        ========================================== -->
        <div class="avatar-section">
            <div class="avatar-preview">
                <img id="avatarPreview" src="assets/images/default-avatar.png" alt="Avatar">
                <button type="button" id="avatarButton" class="upload-button" aria-label="Modifier l'avatar">
                    <i class="fa-solid fa-camera"></i>
                </button>
            </div>
            <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            <p class="upload-info">Avatar optionnel</p>
        </div>

        <!-- ==========================================
        Banner Section
        ========================================== -->
        <div class="banner-section">
            <div class="banner-preview" id="bannerPreviewContainer">
                <img id="bannerImage" src="assets/images/default-banner.png" alt="Bannière">
                <button type="button" id="bannerButton" class="upload-button" aria-label="Modifier la bannière">
                    <i class="fa-solid fa-image"></i>
                </button>
            </div>
            <input type="file" id="bannerInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            <p class="upload-info">Bannière optionnelle</p>
        </div>

        <!-- ==========================================
        Profile Form
        ========================================== -->
        <form id="profileForm" class="profile-form">

            <!-- Username -->
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <div class="input-container">
                    <i class="fa-solid fa-at"></i>
                    <input type="text" id="username" name="username" placeholder="username" autocomplete="username">
                </div>
                <p id="usernameMessage" class="nv-help"></p>
            </div>

            <!-- Display Name -->
            <div class="form-group">
                <label for="displayName">Nom complet</label>
                <div class="input-container">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="displayName" name="displayName" placeholder="Votre nom affiché">
                </div>
                <p id="displayNameMessage" class="nv-help"></p>
            </div>

            <!-- Bio -->
            <div class="form-group">
                <label for="bio">Biographie</label>
                <textarea id="bio" name="bio" maxlength="500" placeholder="Parlez de vous..."></textarea>
                <div class="bio-counter">
                    <span id="bioCounter">0</span>/500
                </div>
            </div>

            <!-- Country -->
            <div class="form-group">
                <label for="country">Pays</label>
                <div class="input-container">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="country" name="country" readonly placeholder="Sélectionnez votre pays">
                </div>
            </div>

            <!-- Language -->
           <div class="form-group">
    <label for="language">Langue</label>
    <div class="input-container">
        <i class="fa-solid fa-language"></i>
        <select id="language" name="language">
            <!-- Langues principales / favoris en haut -->
            <option value="fr">Français</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="ht">Kreyòl ayisyen</option>
            <option value="pt">Português</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>

            <option value="" disabled>────────────────────────</option>

            <!-- Langues du monde (ordre alphabétique) -->
            <option value="af">Afrikaans</option>
            <option value="sq">Shqip (Albanais)</option>
            <option value="am">አማርኛ (Amharique)</option>
            <option value="ar">العربية (Arabe)</option>
            <option value="hy">Հայերեն (Arménien)</option>
            <option value="az">Azərbaycan (Azéri)</option>
            <option value="eu">Euskara (Basque)</option>
            <option value="bn">বাংলা (Bengali)</option>
            <option value="my">မြန်မာဘာသာ (Birman)</option>
            <option value="bs">Bosanski (Bosniaque)</option>
            <option value="bg">Български (Bulgare)</option>
            <option value="ca">Català (Catalan)</option>
            <option value="zh">中文 (Chinois)</option>
            <option value="ko">한국어 (Coréen)</option>
            <option value="co">Corsu (Corse)</option>
            <option value="hr">Hrvatski (Croate)</option>
            <option value="da">Dansk (Danois)</option>
            <option value="eo">Esperanto</option>
            <option value="et">Eesti (Estonien)</option>
            <option value="fi">Suomi (Finnois)</option>
            <option value="gd">Gàidhlig (Géodique écossais)</option>
            <option value="gl">Galego (Galicien)</option>
            <option value="cy">Cymraeg (Gallois)</option>
            <option value="ka">ქართული (Géorgien)</option>
            <option value="el">Ελληνικά (Grec)</option>
            <option value="gu">ગુજરાતી (Gujarati)</option>
            <option value="ha">Hausa</option>
            <option value="he">עברית (Hébreu)</option>
            <option value="hi">हिन्दी (Hindi)</option>
            <option value="hu">Magyar (Hongrois)</option>
            <option value="ig">Igbo</option>
            <option value="id">Bahasa Indonesia (Indonésien)</option>
            <option value="ga">Gaeilge (Irlandais)</option>
            <option value="is">Íslenska (Islandais)</option>
            <option value="ja">日本語 (Japonais)</option>
            <option value="jv">Basa Jawa (Javanais)</option>
            <option value="kn">ಕನ್ನಡ (Kannada)</option>
            <option value="kk">Қазақ тілі (Kazakh)</option>
            <option value="km">ខ្មែរ (Khmer)</option>
            <option value="ku">Kurdî (Kurde)</option>
            <option value="ky">Кыргызча (Kirghize)</option>
            <option value="lo">ລາວ (Lao)</option>
            <option value="la">Latina (Latin)</option>
            <option value="lv">Latviešu (Letton)</option>
            <option value="lt">Lietuvių (Lituanien)</option>
            <option value="lb">Lëtzebuergesch (Luxembourgeois)</option>
            <option value="mk">Македонски (Macédonien)</option>
            <option value="ms">Bahasa Melayu (Malais)</option>
            <option value="ml">മലയാളം (Malayalam)</option>
            <option value="mt">Malti (Maltais)</option>
            <option value="mi">Māori</option>
            <option value="mr">मराठी (Marathi)</option>
            <option value="mn">Монгол (Mongol)</option>
            <option value="ne">नेपाली (Népalais)</option>
            <option value="no">Norsk (Norvégien)</option>
            <option value="nl">Nederlands (Néerlandais)</option>
            <option value="uz">Oʻzbekcha (Ouzbek)</option>
            <option value="ps">پښتو (Pachto)</option>
            <option value="pa">ਪੰਜਾਬੀ (Pendjabi)</option>
            <option value="fa">فارسی (Persan)</option>
            <option value="pl">Polski (Polonais)</option>
            <option value="ro">Română (Roumain)</option>
            <option value="ru">Русский (Russe)</option>
            <option value="so">Soomaaliga (Somali)</option>
            <option value="sv">Svenska (Suédois)</option>
            <option value="tl">Tagalog (Tagalog / Filipino)</option>
            <option value="tg">Тоҷикӣ (Tadjik)</option>
            <option value="ta">தமிழ் (Tamoul)</option>
            <option value="cs">Čeština (Tchèque)</option>
            <option value="te">తెలుగు (Télougou)</option>
            <option value="th">ไทย (Thaï)</option>
            <option value="tr">Türkçe (Turc)</option>
            <option value="uk">Українська (Ukrainien)</option>
            <option value="ur">اردو (Ourdou)</option>
            <option value="vi">Tiếng Việt (Vietnamien)</option>
            <option value="yi">ייִדיש (Yiddish)</option>
            <option value="yo">Yoruba</option>
            <option value="zu">isiZulu (Zoulou)</option>

        </select>
    </div>
</div>

            <!-- ==========================================
            Informations du compte
            ========================================== -->
            <div class="profile-info">
                <div class="info-item">
                    <span>Adresse e-mail</span>
                    <strong id="emailAddress"></strong>
                </div>
                <div class="info-item">
                    <span>Compte vérifié (KYC)</span>
                    <strong id="verifiedBadge">Non vérifié</strong>
                </div>
                <div class="info-item">
                    <span>Entreprise vérifiée</span>
                    <strong id="companyVerifiedBadge">Non vérifiée</strong>
                </div>
            </div>

            <!-- ==========================================
            Buttons
            ========================================== -->
            <div class="profile-buttons">
                <button type="submit" id="saveProfileButton" class="nv-btn nv-btn-primary">
                    <span id="saveProfileText">Enregistrer le profil</span>
                    <span id="saveProfileLoader" hidden>Enregistrement...</span>
                </button>
                <button type="button" id="logoutButton" class="nv-btn nv-btn-secondary">
                    Se déconnecter
                </button>
            </div>

        </form>
    </section>
</main>

<!-- ==========================================
Country Modal
========================================== -->
<div id="countryModal" class="country-modal">
    <div class="country-box">
        <div class="country-header">
            <h2>Choisir un pays</h2>
            <button type="button" id="closeCountryModal" aria-label="Fermer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <input type="text" id="countrySearch" placeholder="Rechercher un pays...">
        <div id="countryList" class="country-list"></div>
    </div>
</div>

<!-- Loader Global (Inchangé) -->
<div id="pageLoader" class="nv-page-loader" style="display:none;">
    <div class="nv-spinner nv-spinner-lg"></div>
    <div class="nv-loader-text">Veuillez patienter...</div>
</div>

<!-- ==========================================
Notification
========================================== -->
<div id="notification" class="notification"></div>

<!-- ==========================================
Scripts
========================================== -->
<script type="module" src="js/pages/profile.js"></script>

</body>
</html>
