<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - NetView</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Core CSS -->
    <link rel="stylesheet" href="CSS/core/variables.css">
    <link rel="stylesheet" href="CSS/core/reset.css">
    <link rel="stylesheet" href="CSS/core/typography.css">
    <link rel="stylesheet" href="CSS/core/animations.css">

    <!-- Components -->
    <link rel="stylesheet" href="CSS/components/buttons.css">
    <link rel="stylesheet" href="CSS/components/forms.css">
    <link rel="stylesheet" href="CSS/components/toast.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="CSS/pages/forgot-password.css">
</head>

<body>

<!-- Background Animated -->
<div class="netview-background"></div>

<!-- Global Loader -->
<div id="globalLoader" class="global-loader">
    <div class="loader-circle"></div>
</div>

<main class="forgot-page">
    <section class="forgot-card">

        <!-- Logo -->
        <div class="forgot-logo">
            <img src="NetView.png" alt="NetView">
        </div>

        <h1>Mot de passe oublié ?</h1>
        <p class="forgot-description">
            Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.
        </p>

        <!-- Form -->
        <form id="forgotForm" class="forgot-form">
            
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <div class="input-container">
                    <i class="fa-solid fa-envelope"></i>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="votre@email.com" 
                        autocomplete="email"
                    >
                </div>
                <div id="forgotError" class="error"></div>
            </div>

            <div class="forgot-buttons">
                <button type="submit" id="submitButton" class="nv-btn nv-btn-primary">
                    <span id="submitText">Envoyer le lien</span>
                    <span id="submitLoader" hidden>Envoi en cours...</span>
                </button>
            </div>

            <div class="forgot-footer">
                <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Retour à la connexion</a>
            </div>

        </form>

    </section>
</main>

<!-- Notification -->
<div id="notification" class="notification"></div>

<!-- Scripts -->
<script type="module" src="js/core/supabase.js"></script>
<script type="module" src="js/pages/forgot-password.js"></script>

</body>
</html>
