<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Confirmation du compte</title>

<style>
/* ==================================================
CONFIRM EMAIL PAGE
================================================== */

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--nv-background, #0b1120);
    color: var(--nv-text-primary, #fff);
    font-family: inherit;
    margin: 0;
    padding: 1rem;
    text-align: center;
}

.confirm-container {
    width: min(100%, 420px);
    padding: 2.5rem;
    border-radius: 24px;
    backdrop-filter: blur(25px);
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    animation: fadeUp .6s ease;
}

.confirm-spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(37, 99, 235, 0.2);
    border-top-color: var(--nv-primary, #2563eb);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

.confirm-container p {
    font-size: 1rem;
    color: var(--nv-text-secondary, #94a3b8);
    margin: 0;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>


<script type="module">

import { supabase } from "./js/core/supabase.js";

(async()=>{

    const hash = window.location.hash;
    const searchParams = new URLSearchParams(window.location.search);
    const type = searchParams.get("type");

    // -------------------------
    // Cas erreur envoyé par Supabase
    // -------------------------
    if(hash.includes("error=")){
        const params = new URLSearchParams(hash.substring(1));
        const code = params.get("error_code");

        if(code === "otp_expired"){
            location.replace("signup.html?status=expired");
            return;
        }

        location.replace("signup.html?status=failed");
        return;
    }

    // -------------------------
    // Cas Récupération de mot de passe (Recovery)
    // -------------------------
    if(type === "recovery" || hash.includes("type=recovery")){
        location.replace("change-password.html" + hash);
        return;
    }

    // -------------------------
    // Vérification session / compte standard
    // -------------------------
    const { data } = await supabase.auth.getUser();

    if(data.user && data.user.email_confirmed_at){
        location.replace("profile.html");
        return;
    }

    location.replace("signup.html?status=failed");

})();

</script>

</head>

<body>

<div class="confirm-container">
    <div class="confirm-spinner"></div>
    <p>Patientez pendant la vérification...</p>
</div>

</body>

</html>
