<style>

/* ==================================================
BODY
================================================== */

body{

    overflow:auto;

    background:
    var(--nv-background);

}

/* ==================================================
BACKGROUND
================================================== */

.nv-auth-background{

    position:fixed;

    inset:0;

    overflow:hidden;

    z-index:-10;

    background:

    radial-gradient(circle at top left,
    rgba(37,99,235,.25),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(96,165,250,.18),
    transparent 45%),

    linear-gradient(
        135deg,
        #020617,
        #071124,
        #0B1120,
        #020617
    );

}

.nv-auth-background::before{

    content:"";

    position:absolute;

    inset:-20%;

    background:

    linear-gradient(

        135deg,

        transparent,

        rgba(37,99,235,.08),

        transparent,

        rgba(96,165,250,.10),

        transparent

    );

    background-size:300% 300%;

    animation:

    gradientMove 18s linear infinite;

    filter:blur(80px);

}

.nv-auth-background::after{

    content:"";

    position:absolute;

    inset:0;

    background-image:

    linear-gradient(
        rgba(255,255,255,.03) 1px,
        transparent 1px),

    linear-gradient(
        90deg,
        rgba(255,255,255,.03) 1px,
        transparent 1px);

    background-size:

    50px 50px;

    mask-image:

    radial-gradient(circle,
    white,
    transparent 92%);

}

/* ==================================================
BLUE ORBS
================================================== */

.nv-orb{

    position:absolute;

    border-radius:50%;

    filter:blur(70px);

    animation:

    floatOrb 12s ease-in-out infinite;

}

.nv-orb.one{

    width:320px;

    height:320px;

    top:-120px;

    left:-120px;

    background:

    rgba(37,99,235,.30);

}

.nv-orb.two{

    width:260px;

    height:260px;

    bottom:-80px;

    right:-80px;

    background:

    rgba(96,165,250,.25);

    animation-delay:2s;

}

.nv-orb.three{

    width:180px;

    height:180px;

    left:60%;

    top:35%;

    background:

    rgba(59,130,246,.18);

    animation-delay:5s;

}

/* ==================================================
PARTICLES
================================================== */

.nv-particles{

    position:absolute;

    inset:0;

}

.nv-particles span{

    position:absolute;

    width:3px;

    height:3px;

    border-radius:50%;

    background:

    rgba(255,255,255,.55);

    animation:

    particleFloat linear infinite;

}

.nv-particles span:nth-child(1){left:5%;top:12%;animation-duration:20s;}
.nv-particles span:nth-child(2){left:16%;top:72%;animation-duration:16s;}
.nv-particles span:nth-child(3){left:27%;top:35%;animation-duration:18s;}
.nv-particles span:nth-child(4){left:38%;top:82%;animation-duration:24s;}
.nv-particles span:nth-child(5){left:50%;top:18%;animation-duration:15s;}
.nv-particles span:nth-child(6){left:62%;top:60%;animation-duration:20s;}
.nv-particles span:nth-child(7){left:73%;top:28%;animation-duration:19s;}
.nv-particles span:nth-child(8){left:84%;top:78%;animation-duration:22s;}
.nv-particles span:nth-child(9){left:93%;top:16%;animation-duration:17s;}
.nv-particles span:nth-child(10){left:44%;top:48%;animation-duration:23s;}
.nv-particles span:nth-child(11){left:12%;top:52%;animation-duration:21s;}
.nv-particles span:nth-child(12){left:79%;top:8%;animation-duration:18s;}

/* ==================================================
LAYOUT
================================================== */

.nv-auth{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:2rem;

}

.nv-auth-card{

    width:min(100%,540px);

    padding:3rem;

    position:relative;

    overflow:hidden;

    border-radius:34px;

    backdrop-filter:blur(30px);

    background:

    rgba(15,23,42,.72);

    border:

    1px solid rgba(255,255,255,.08);

    box-shadow:

    0 40px 90px rgba(0,0,0,.45);

    animation:

    fadeUp .8s ease;

}

.nv-auth-card::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:inherit;

    padding:1px;

    background:

    linear-gradient(

        135deg,

        rgba(37,99,235,.7),

        rgba(96,165,250,.15),

        transparent

    );

    -webkit-mask:

        linear-gradient(#fff 0 0) content-box,

        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;

    mask-composite:exclude;

    pointer-events:none;

}

/* ==================================================
LOGO
================================================== */

.nv-auth-logo{

    width:120px;

    display:block;

    margin:auto;

    animation:

    floatLogo 5s ease-in-out infinite;

}

.nv-auth-title{

    margin-top:1.6rem;

    text-align:center;

}

.nv-auth-subtitle{

    margin-top:.9rem;

    margin-bottom:2.5rem;

    text-align:center;

    color:var(--nv-text-secondary);

    line-height:1.8;

}

/* ==================================================
BUTTONS
================================================== */

.nv-auth-actions{

    display:flex;

    flex-direction:column;

    gap:1rem;

}

.nv-auth-btn{

    width:100%;

    height:62px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:.9rem;

    font-size:1rem;

    text-decoration:none;

    position:relative;

    overflow:hidden;

}

.nv-auth-btn i{

    font-size:1.1rem;

}

.nv-auth-btn::before{

    content:"";

    position:absolute;

    top:0;

    left:-120%;

    width:55%;

    height:100%;

    background:

    linear-gradient(

        90deg,

        transparent,

        rgba(255,255,255,.35),

        transparent

    );

    transition:.8s;

}

.nv-auth-btn:hover::before{

    left:170%;

}

.nv-auth-btn-secondary{

    background:

    rgba(255,255,255,.06);

    color:#fff;

    border:

    1px solid rgba(255,255,255,.08);

}

.nv-auth-btn-secondary:hover{

    background:

    rgba(255,255,255,.10);

}

.nv-auth-btn-outline{

    background:transparent;

    color:#fff;

    border:

    1px solid rgba(255,255,255,.10);

}

.nv-auth-btn-outline:hover{

    border-color:

    rgba(37,99,235,.5);

    background:

    rgba(37,99,235,.08);

}

/* ==================================================
FOOTER
================================================== */

.nv-auth-footer{

    margin-top:2rem;

    text-align:center;

    color:var(--nv-text-muted);

    font-size:.85rem;

}

/* ==================================================
RESPONSIVE
================================================== */

@media(max-width:768px){

    .nv-auth{

        padding:1rem;

    }

    .nv-auth-card{

        padding:2rem 1.5rem;

        border-radius:24px;

    }

    .nv-auth-logo{

        width:220px;

    }

    .nv-auth-title{

        font-size:2rem;

    }

    .nv-auth-subtitle{

        font-size:.95rem;

    }

}

</style>

</head>
<body>


<div class="nv-auth-background">

    <div class="nv-orb one"></div>

    <div class="nv-orb two"></div>

    <div class="nv-orb three"></div>


    <div class="nv-particles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

</div>


<main class="nv-auth">


<section class="nv-auth-card">


<img

    src="NetView.png"

    alt="NetView"

    class="nv-auth-logo">


<h1 class="nv-auth-title">

    Bienvenue sur NetView

</h1>


<p class="nv-auth-subtitle">

    La plateforme qui réunit vidéos, shorts, lives,
    communautés, messagerie et marketplace.

</p>



<div class="nv-auth-actions">


<a

href="login.html"

class="nv-btn nv-btn-gradient nv-auth-btn">

<i class="fa-solid fa-right-to-bracket"></i>

<span>

    Se connecter

</span>

</a>



<a

href="signup.html"

class="nv-btn nv-btn-gradient nv-auth-btn">

<i class="fa-solid fa-user-plus"></i>

<span>

    Créer un compte

</span>

</a>



<a

href="index.html"

class="nv-auth-btn nv-auth-btn-secondary">

<i class="fa-solid fa-user-secret"></i>

<span>

    Continuer en tant que visiteur

</span>

</a>



</div>



<div class="nv-auth-footer">

    NetView v1.0 • Tous droits réservés

</div>



</section>


</main>



<div

class="nv-page-loader"

id="pageLoader"

style="display:none;">


<div class="nv-spinner nv-spinner-lg"></div>


<div class="nv-loader-text">

Chargement...

</div>


</div>
<script type="module">


// ==========================================
// Imports
// ==========================================

import {

    getSession

} from "./js/core/auth.js";


import {

    navigate

} from "./js/core/navigation.js";



// ==========================================
// Check Existing Session
// ==========================================

(async()=>{


    try{


        const session =

            await getSession();



        if(session){


            navigate(

                "index.html"

            );


        }


    }

    catch(error){


        console.error(

            "Auth check error:",

            error

        );


    }


})();



// ==========================================
// Button Animation Protection
// ==========================================

const buttons =

document.querySelectorAll(

    ".nv-auth-btn"

);



buttons.forEach(button=>{


    button.addEventListener(

        "click",

        ()=>{


            button.style.transform =

            "scale(.97)";



            setTimeout(()=>{


                button.style.transform =

                "";


            },150);



        }

    );


});



// ==========================================
// Save Last Page
// ==========================================

document.addEventListener(

    "click",

    event=>{


        const link =

        event.target.closest("a");



        if(!link){

            return;

        }



        const href =

        link.getAttribute("href");



        if(

            href &&

            href.endsWith(".html") &&

            ![

                "auth.html",

                "login.html",

                "signup.html"

            ].includes(href)

        ){


            sessionStorage.setItem(

                "netview_last_page",

                href

            );


        }


    }

);



// ==========================================
// Ready
// ==========================================

console.log(

    "NetView Auth Portal Ready"

);


</script>


</body>

</html>
